version: '3'

tasks:
  install-foundryctl:
    desc: Instala ou verifica Foundry/foundryctl na VPS.
    cmds:
      - ./scripts/remote.sh foundryctl

  install-signoz:
    desc: Instala ou verifica SigNoz self-hosted via Foundry/foundryctl.
    cmds:
      - task: install-foundryctl
      - ./scripts/remote.sh signoz

  install-postgres-collector:
    desc: Instala ou verifica o collector PostgreSQL que envia métricas ao SigNoz.
    cmds:
      - ./scripts/remote.sh postgres-collector

  install-application-otel-collector:
    desc: Instala ou verifica o collector OTLP que encaminha métricas e traces da aplicação ao SigNoz.
    cmds:
      - ./scripts/remote.sh application-otel-collector

  firewall:
    desc: Configura somente as regras UFW específicas do SigNoz.
    cmds:
      - ./scripts/remote.sh signoz-firewall

  status:
    desc: Verifica SigNoz e o collector PostgreSQL sem imprimir segredos.
    cmds:
      - ./scripts/remote.sh observability-status

  destroy:
    desc: Remove SigNoz, collector e regras específicas de observabilidade.
    cmds:
      - ./scripts/remote.sh observability-destroy
